name: Weekly Polymarket Screenshot

on:
  schedule:
    # 毎週月曜 09:00 JST = UTC 00:00 (UTCはJSTの9時間前)
    - cron: '0 0 * * 1'
  workflow_dispatch: {}  # 手動実行もできるように(Actionsタブから「Run workflow」で即実行可)

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Take screenshot
        run: node scripts/capture.js

      - name: Commit and push screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshots/
          git diff --staged --quiet || git commit -m "chore: weekly Polymarket screenshot $(date +'%Y-%m-%d')"
          git push
