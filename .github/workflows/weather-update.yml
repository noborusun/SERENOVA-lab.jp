name: Update SERENOVA Omiya Weather
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch weather data
        run: python weather/update_forecast.py
      - name: Commit updated forecast
        run: |
          if git diff --quiet -- weather/forecast.json; then
            echo "No forecast changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather/forecast.json
          git commit -m "Update Omiya weather forecast"
          git push
